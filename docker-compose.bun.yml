services:
  omniroute:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - '20128'
      - '20129'
    volumes:
      - omniroute-prod-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-20128}
      - DASHBOARD_PORT=${DASHBOARD_PORT:-${PORT:-20128}}
      - API_PORT=${API_PORT:-20129}
      - API_HOST=${API_HOST:-0.0.0.0}
      - HOSTNAME=0.0.0.0
      - DATA_DIR=/app/data
      - PATH=/home/node/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - JWT_SECRET=${JWT_SECRET}
      - API_KEY_SECRET=${API_KEY_SECRET}
      - INITIAL_PASSWORD=${INITIAL_PASSWORD}
      - STORAGE_ENCRYPTION_KEY=${STORAGE_ENCRYPTION_KEY}
      - STORAGE_ENCRYPTION_KEY_VERSION=${STORAGE_ENCRYPTION_KEY_VERSION}
      - MACHINE_ID_SALT=${MACHINE_ID_SALT}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-true}
      - REQUIRE_API_KEY=${REQUIRE_API_KEY:-true}
      - ALLOW_API_KEY_REVEAL=${ALLOW_API_KEY_REVEAL:-true}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL}
      - APP_LOG_TO_FILE=${APP_LOG_TO_FILE}

  redis:
    image: redis:8.6.2-alpine
    restart: unless-stopped
    volumes:
      - redis-prod-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  omniroute-prod-data:
  redis-prod-data:
